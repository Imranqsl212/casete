name: Build Repo Cassette artifacts

on:
  push:
    branches: [main]
    paths:
      - "artifact-action/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - uses: ./artifact-action
